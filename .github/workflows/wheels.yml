name: Build the wheels of one platform

# Called by publish.yml once per runner. One job builds every CPython version in turn, so OCCT
# (~20+ min) is built once per job and reused by every version (CMake reuses a complete OCCT
# install). On Windows and macOS the install is also cached across runs; on Linux it lives inside
# the manylinux container, which cibuildwheel does not copy back to the runner, so Linux builds it
# once per run.

on:
  workflow_call:
    inputs:
      os:
        description: 'The runner to build on (ubuntu-22.04, windows-2022 or macos-15)'
        required: true
        type: string

env:
  GIT_LFS_SKIP_SMUDGE: 1
  OCCT_CACHE_KEY: occt-7.9.3-static-v1

jobs:
  build:
    name: Wheels on ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # MKF fetches Kirchhoff, whose PSMA submodules (RAS, SAS, TAS, AAS, ...) have SSH URLs; the
      # runners have no SSH key, so clone them over HTTPS. (The Linux container sets the same
      # rewrite in its before-all, since it does not see the runner's git config.)
      - name: Clone GitHub submodules over HTTPS
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Restore and save are separate steps so a built OCCT is saved even when a later step fails
      # (actions/cache saves only on job success, so every failed Windows job rebuilt OCCT, ~40 min).
      - name: Restore OCCT install
        id: occt_cache
        if: runner.os != 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: .occt-install
          key: ${{ env.OCCT_CACHE_KEY }}-${{ runner.os }}

      - name: Point the build at the OCCT install
        shell: bash
        run: |
          ws=$(python -c "import os;print(os.environ['GITHUB_WORKSPACE'].replace('\\\\','/'))")
          echo "CIBW_ENVIRONMENT_LINUX=CMAKE_BUILD_PARALLEL_LEVEL=2 SKBUILD_CMAKE_DEFINE=\"OCCT_PREFIX=/opt/occt-install\"" >> "$GITHUB_ENV"
          echo "CIBW_ENVIRONMENT_MACOS=MACOSX_DEPLOYMENT_TARGET=14.0 CMAKE_BUILD_PARALLEL_LEVEL=3 SKBUILD_CMAKE_DEFINE=\"OCCT_PREFIX=$ws/.occt-install\"" >> "$GITHUB_ENV"
          echo "CIBW_ENVIRONMENT_WINDOWS=CMAKE_BUILD_PARALLEL_LEVEL=1 SKBUILD_CMAKE_DEFINE=\"OCCT_PREFIX=$ws/.occt-install\"" >> "$GITHUB_ENV"

      - name: Build and test wheels
        run: |
          python -m pip install cibuildwheel==4.2.0
          python -m cibuildwheel --output-dir wheelhouse

      - name: Save OCCT install
        # Only a complete install (the last toolkit in OCCT_ESSENTIAL_LIBS present), only on a cache miss.
        if: always() && runner.os != 'Linux' && steps.occt_cache.outputs.cache-hit != 'true' && hashFiles('.occt-install/lib/*TKDEVRML*') != ''
        uses: actions/cache/save@v4
        with:
          path: .occt-install
          key: ${{ env.OCCT_CACHE_KEY }}-${{ runner.os }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ inputs.os }}
          path: wheelhouse/*.whl
