name: Build and publish the Python package

# Builds the ONE Python package of MVB++ (PyPI: OpenMagneticsVirtualBuilder, module `mvbpp`)
# for Linux, Windows and macOS, and publishes it. A release is the Linux and Windows wheels plus the
# source distribution; the macOS wheels are added when their (slower) build succeeds.
#   - a pushed tag vX.Y.Z -> PyPI (the tag must equal pyproject's version)
#   - workflow_dispatch   -> TestPyPI, unless publish_to_pypi is ticked
# Needs the secrets PYPI_API_TOKEN / TEST_PYPI_API_TOKEN, scoped to OpenMagneticsVirtualBuilder.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish to the real PyPI instead of TestPyPI'
        required: false
        default: false
        type: boolean
      os:
        description: 'Build wheels only on this runner (to re-test one platform without paying for the others)'
        required: false
        default: 'all'
        type: choice
        options: [all, ubuntu-22.04, windows-2022, macos-15]

env:
  GIT_LFS_SKIP_SMUDGE: 1

jobs:
  check_version:
    name: Tag matches pyproject version
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5   # tomllib needs Python >= 3.11; the runner's system Python is 3.10
        with:
          python-version: '3.12'
      - name: Compare
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match pyproject version $ver"; exit 1
          fi

  # Linux and Windows are the release: it is published when these two and the source distribution
  # are done. The build itself is wheels.yml, one call per runner.
  build_wheels:
    if: github.event_name != 'workflow_dispatch' || inputs.os != 'macos-15'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.os != 'all') && format('["{0}"]', inputs.os) || '["ubuntu-22.04","windows-2022"]') }}
    uses: ./.github/workflows/wheels.yml
    with:
      os: ${{ matrix.os }}

  # macOS is built on every release and never waited for (Alf, 2026-11-26: "we dont care about
  # macos", then "Build macOS, never wait for it"): its wheels are added to the release if and when
  # this job succeeds, and its failure blocks nothing.
  build_wheels_macos:
    if: github.event_name != 'workflow_dispatch' || inputs.os == 'all' || inputs.os == 'macos-15'
    uses: ./.github/workflows/wheels.yml
    with:
      os: macos-15

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish
    needs: [check_version, build_wheels, build_sdist]
    # check_version is skipped on workflow_dispatch; a skipped need still lets this run.
    # A single-platform manual run never publishes: the release must carry the Linux and Windows wheels.
    if: always() && needs.build_wheels.result == 'success' && needs.build_sdist.result == 'success' && needs.check_version.result != 'failure' && (github.event_name != 'workflow_dispatch' || inputs.os == 'all')
    runs-on: ubuntu-22.04
    steps:
      # Everything built so far: the source distribution, Linux and Windows (and macOS, should it be done already).
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch' || inputs.publish_to_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          packages-dir: dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_to_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
          packages-dir: dist/

  # The macOS wheels join a release that exists: only after Publish succeeded, only if they built.
  publish_macos:
    name: Publish the macOS wheels
    needs: [publish, build_wheels_macos]
    if: always() && needs.publish.result == 'success' && needs.build_wheels_macos.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-macos-15
          path: dist

      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch' || inputs.publish_to_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          packages-dir: dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_to_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
          packages-dir: dist/
