name: Build and publish the Python package

# Builds the ONE Python package of MVB++ (PyPI: OpenMagneticsVirtualBuilder, module `mvbpp`)
# for Linux, Windows and macOS, and publishes it.
#   - a pushed tag vX.Y.Z -> PyPI (the tag must equal pyproject's version)
#   - workflow_dispatch   -> TestPyPI, unless publish_to_pypi is ticked
# Needs the secrets PYPI_API_TOKEN / TEST_PYPI_API_TOKEN, scoped to OpenMagneticsVirtualBuilder.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish to the real PyPI instead of TestPyPI'
        required: false
        default: false
        type: boolean

env:
  GIT_LFS_SKIP_SMUDGE: 1
  OCCT_CACHE_KEY: occt-7.9.3-static-v1

jobs:
  check_version:
    name: Tag matches pyproject version
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5   # tomllib needs Python >= 3.11; the runner's system Python is 3.10
        with:
          python-version: '3.12'
      - name: Compare
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match pyproject version $ver"; exit 1
          fi

  # One job per OS builds every CPython version in turn, so OCCT (~20+ min) is built once per job
  # and reused by every version (CMake reuses a complete OCCT install). On Windows and macOS the install is also
  # cached across runs; on Linux it lives inside the manylinux container, which cibuildwheel does
  # not copy back to the runner, so Linux builds it once per run.
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # MKF fetches Kirchhoff, whose PSMA submodules (RAS, SAS, TAS, AAS, ...) have SSH URLs; the
      # runners have no SSH key, so clone them over HTTPS. (The Linux container sets the same
      # rewrite in its before-all, since it does not see the runner's git config.)
      - name: Clone GitHub submodules over HTTPS
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: OCCT install cache
        if: runner.os != 'Linux'
        uses: actions/cache@v4
        with:
          path: .occt-install
          key: ${{ env.OCCT_CACHE_KEY }}-${{ runner.os }}

      - name: Point the build at the OCCT install
        shell: bash
        run: |
          ws=$(python -c "import os;print(os.environ['GITHUB_WORKSPACE'].replace('\\\\','/'))")
          echo "CIBW_ENVIRONMENT_LINUX=CMAKE_BUILD_PARALLEL_LEVEL=2 SKBUILD_CMAKE_DEFINE=\"OCCT_PREFIX=/opt/occt-install\"" >> "$GITHUB_ENV"
          echo "CIBW_ENVIRONMENT_MACOS=MACOSX_DEPLOYMENT_TARGET=14.0 CMAKE_BUILD_PARALLEL_LEVEL=3 SKBUILD_CMAKE_DEFINE=\"OCCT_PREFIX=$ws/.occt-install\"" >> "$GITHUB_ENV"
          echo "CIBW_ENVIRONMENT_WINDOWS=CMAKE_BUILD_PARALLEL_LEVEL=2 SKBUILD_CMAKE_DEFINE=\"OCCT_PREFIX=$ws/.occt-install\"" >> "$GITHUB_ENV"

      - name: Build and test wheels
        run: |
          python -m pip install cibuildwheel==4.2.0
          python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish
    needs: [check_version, build_wheels, build_sdist]
    # check_version is skipped on workflow_dispatch; a skipped need still lets this run.
    if: always() && needs.build_wheels.result == 'success' && needs.build_sdist.result == 'success' && needs.check_version.result != 'failure'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch' || inputs.publish_to_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          packages-dir: dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_to_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
          packages-dir: dist/
